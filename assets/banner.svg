<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0c152e" />
      <stop offset="100%" stop-color="#050813" />
    </linearGradient>

    <!-- Glowing Cyber Grid -->
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.04" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.04" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0c152e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="badgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.05); }
      }
      @keyframes floatAgent {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes packetMove1 {
        0% { transform: translateX(-200px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(1300px); opacity: 0; }
      }
      @keyframes packetMove2 {
        0% { transform: translateX(-150px); opacity: 0; }
        25% { opacity: 0.85; }
        75% { opacity: 0.85; }
        100% { transform: translateX(1350px); opacity: 0; }
      }
      @keyframes statusBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      .bg-pulse {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: 600px 180px;
      }
      .agent-float {
        animation: floatAgent 4.5s ease-in-out infinite;
      }
      .packet-flow-1 {
        animation: packetMove1 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .packet-flow-2 {
        animation: packetMove2 9s cubic-bezier(0.4, 0, 0.2, 1) infinite 2s;
      }
      .status-dot {
        animation: statusBlink 2.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="12" fill="url(#bgGrad)" />

  <!-- Cyber Grid -->
  <g stroke="url(#gridGrad)" stroke-width="1" opacity="0.7">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="95" x2="1200" y2="95" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="205" x2="1200" y2="205" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="680" y1="0" x2="680" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="920" y1="0" x2="920" y2="360" />
    <line x1="1040" y1="0" x2="1040" y2="360" />
    <line x1="1140" y1="0" x2="1140" y2="360" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="180" r="170" fill="url(#heroGlow)" class="bg-pulse" />
  <circle cx="1060" cy="160" r="210" fill="url(#badgeGlow)" class="bg-pulse" />

  <!-- Animated Data Streams -->
  <g opacity="0.65">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,6" />
    <g class="packet-flow-1">
      <rect x="0" y="58" width="90" height="4" rx="2" fill="url(#beamGrad)" />
      <circle cx="90" cy="60" r="3" fill="#38bdf8" />
    </g>

    <line x1="0" y1="315" x2="1200" y2="315" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,8" />
    <g class="packet-flow-2">
      <rect x="0" y="313" width="110" height="4" rx="2" fill="url(#beamGrad)" />
      <circle cx="110" cy="315" r="3.5" fill="#a855f7" />
    </g>
  </g>

  <!-- Left Side: AI Agent & Bot Self-Service Automation Graphic -->
  <g transform="translate(60, 95)" class="agent-float">
    <!-- Hexagonal Outer Frame -->
    <polygon points="60,0 115,30 115,95 60,125 5,95 5,30" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" opacity="0.92" filter="url(#softGlow)" />
    <polygon points="60,14 102,37 102,88 60,111 18,88 18,37" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" opacity="0.85" />
    
    <!-- AI Bot & Resolution Nodes -->
    <!-- Head/Antenna -->
    <circle cx="60" cy="38" r="4" fill="#38bdf8" />
    <line x1="60" y1="42" x2="60" y2="48" stroke="#38bdf8" stroke-width="2" />
    <!-- Bot Head Screen -->
    <rect x="42" y="48" width="36" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
    <circle cx="51" cy="60" r="2.5" fill="#38bdf8" />
    <circle cx="69" cy="60" r="2.5" fill="#38bdf8" />
    <!-- Deflection / Ticket Flow Arrows -->
    <path d="M 36 82 L 48 82 M 48 82 L 44 78 M 48 82 L 44 86" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 84 82 L 72 82 M 72 82 L 76 78 M 72 82 L 76 86" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="60" cy="82" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
    <circle cx="60" cy="82" r="2" fill="#34d399" />

    <!-- Outer Circuit Pulse Nodes -->
    <circle cx="60" cy="0" r="4" fill="#38bdf8" />
    <circle cx="115" cy="95" r="3.5" fill="#818cf8" />
    <circle cx="5" cy="95" r="3.5" fill="#c084fc" />
  </g>

  <!-- Foreground Content: Header, Badges & Pills -->
  <g transform="translate(205, 0)">
    
    <!-- Category Mini-Pill Badge -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="330" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="14" r="5" fill="#10b981" class="status-dot" />
      <text x="30" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">AI-FIRST RESOLUTION &amp; DEFLECTION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="124" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">Awesome AI-Powered Self-Service Automation</text>

    <!-- Subtitle / Mission -->
    <text x="0" y="166" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400">
      Curated directory of AI Resolution Agents, Knowledge-Gap Detection, Multi-Channel Deflection &amp; Helpdesk Automation
    </text>

    <!-- Highlighting Pill Badges -->
    <g transform="translate(0, 206)">
      <!-- Pill 1: Resolution Agents -->
      <g transform="translate(0, 0)">
        <rect width="175" height="34" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
        <text x="87.5" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">🤖 Resolution Agents</text>
      </g>
      <!-- Pill 2: Knowledge-Gap Detection -->
      <g transform="translate(187, 0)">
        <rect width="200" height="34" rx="8" fill="#0f172a" stroke="#4f46e5" stroke-width="1.2" />
        <text x="100" y="22" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">🔍 Knowledge-Gap Detection</text>
      </g>
      <!-- Pill 3: Multi-Channel Deflection -->
      <g transform="translate(399, 0)">
        <rect width="195" height="34" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.2" />
        <text x="97.5" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">⚡ Multi-Channel Deflection</text>
      </g>
      <!-- Pill 4: Open Source & Self-Hosted -->
      <g transform="translate(606, 0)">
        <rect width="195" height="34" rx="8" fill="#0f172a" stroke="#7c3aed" stroke-width="1.2" />
        <text x="97.5" y="22" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">🔓 Open-Source &amp; Self-Hosted</text>
      </g>
      <!-- Pill 5: MCP & Orchestration -->
      <g transform="translate(813, 0)">
        <rect width="155" height="34" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="1.2" />
        <text x="77.5" y="22" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">🛠️ MCP Tool Orchestration</text>
      </g>
    </g>

    <!-- Metrics / Features Line -->
    <g transform="translate(0, 268)">
      <circle cx="6" cy="6" r="4" fill="#38bdf8" />
      <text x="18" y="10" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        Enterprise SaaS (Intercom Fin, Zendesk, Ada) • Open-Source Deflection (Owly, TGO, Recourse) • Outcome-Based Pricing
      </text>
    </g>
  </g>

  <!-- Frame Border -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="12" fill="none" stroke="#1e293b" stroke-width="1" />
</svg>
